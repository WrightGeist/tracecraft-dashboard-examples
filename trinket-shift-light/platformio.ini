; Trinket M0 shift light. See README.md.

[env:trinket_m0]
platform = atmelsam
board = adafruit_trinket_m0
framework = arduino
custom_channels = shift_light.channels.json
lib_ignore = USBHost
build_flags =
  -D USE_TINYUSB
  -D TRACECRAFT_STR_LEN=8
  -D TRACECRAFT_BOARD_ID='"$PIOENV"'
lib_deps =
  adafruit/Adafruit DotStar
  https://models.tracecraft.app/sdk/usb/TraceCraftCore-0.1.13.zip
