; Raspberry Pi Pico shift light. See README.md.

[env:pico]
; The earlephilhower core comes from Max Gerhardt's fork of the platform; the registry's
; `raspberrypi` serves the mbed core and ignores board_build.core.
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#03bb48f
board = pico
framework = arduino
board_build.core = earlephilhower
custom_channels = shift_light.channels.json
lib_ignore = USBHost
build_flags =
  -D USE_TINYUSB
  -D TRACECRAFT_BOARD_ID='"$PIOENV"'
lib_deps =
  https://models.tracecraft.app/sdk/usb/TraceCraftCore-0.1.12.zip
