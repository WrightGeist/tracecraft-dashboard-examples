; Waveshare P4 deck. See README.md.

[env:waveshare_p4_lcd5_deck]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
; `esp32-p4` targets the pre-rev-3.00 silicon shipping P4 products carry. If esptool
; reports "chip revision: v3.xx", use `board = esp32-p4_r3`.
board = esp32-p4
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_upload.flash_size = 32MB
board_build.partitions = default_16MB.csv
board_upload.use_1200bps_touch = yes
board_upload.wait_for_upload_port = yes
; The P4 is already in the bootloader when esptool opens the port, and its default
; resets knock it back out. Tap RST after flashing.
board_upload.before_reset = no_reset
board_upload.after_reset = no_reset
build_unflags = -DARDUINO_USB_MODE=1
custom_channels = waveshare_p4_lcd5_deck.channels.json
build_flags =
  -D ARDUINO_USB_MODE=0
  -D ARDUINO_USB_CDC_ON_BOOT=0
  -D TRACECRAFT_BOARD_WAVESHARE_P4_LCD5
  -D TRACECRAFT_BOARD_ID='"$PIOENV"'
  ; 120 KB draw buffers, and a 256 KB widget pool allocated at runtime (lv_conf.h).
  -D TRACECRAFT_LVGL_BUF_KB=120
  -D LV_MEM_SIZE=262144U
  -D TRACECRAFT_LVGL_POOL_PSRAM
  ; The P4's pixel accelerator wants 128-byte aligned draw buffers.
  -D LV_DRAW_BUF_ALIGN=128
  -D CONFIG_LV_DRAW_BUF_ALIGN=128
  -D LV_CONF_INCLUDE_SIMPLE
  -I include
  -D TRACECRAFT_DEVICE_NAME='"TraceCraft P4 Dash Deck"'
lib_deps =
  lvgl/lvgl @ ~9.2.0
  https://models.tracecraft.app/sdk/usb/TraceCraftCore-0.1.12.zip
  https://models.tracecraft.app/sdk/usb/TraceCraftDisplay-0.1.12.zip
