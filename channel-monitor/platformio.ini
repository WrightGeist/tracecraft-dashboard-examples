; Change this one option to monitor-extended.channels.json for the second group.
[monitor]
channels = monitor.channels.json

; Channel monitor. See README.md.

[env:t4_s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; N16R8 boards: 16 MB flash (QIO) + 8 MB PSRAM (OPI).
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
; Flashes a RUNNING dashboard hands-free. A first flash, or a board whose firmware
; does not run, still needs BOOT held while you tap RST.
board_upload.use_1200bps_touch = yes
board_upload.wait_for_upload_port = yes
; USB OTG/TinyUSB is required for a custom HID device, and USB must not come up before
; the HID descriptor is registered.
build_unflags = -DARDUINO_USB_MODE=1
custom_channels = ${monitor.channels}
; LilyGo's library.json declares a second LVGL and libraries this firmware does not use;
; NeoPixel links a legacy RMT driver that aborts at boot on arduino-esp32 3.x.
lib_ignore = Adafruit NeoPixel, AceButton, TinyGPSPlus
extra_scripts = pre:scripts/pio_prune_dup_lvgl.py
build_flags =
  -D ARDUINO_USB_MODE=0
  -D ARDUINO_USB_CDC_ON_BOOT=0
  -D BOARD_HAS_PSRAM
  -D TRACECRAFT_BOARD_ID='"$PIOENV"'
  -D LV_CONF_INCLUDE_SIMPLE
  -I include
  -D TRACECRAFT_BOARD_T4_S3
lib_deps =
  lvgl/lvgl @ ~9.2.0
  xinyuan-lilygo/LilyGo-AMOLED-Series
  https://models.tracecraft.app/sdk/usb/TraceCraftCore-0.1.13.zip
  https://models.tracecraft.app/sdk/usb/TraceCraftDisplay-0.1.13.zip

