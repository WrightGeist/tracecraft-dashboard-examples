; CrowPanel round dial: a TraceCraft dashboard and a gamepad on one cable. See README.md.
;
; Built on ESP-IDF, not Arduino: on arduino-esp32 every HID device shares one USB
; interface, so a board is a dashboard or a gamepad. Here the project owns TinyUSB
; (src/tusb_config.h, src/usb_descriptors.c) and gives each its own interface.
;
; Run PlatformIO from PowerShell or cmd, not Git Bash: ESP-IDF refuses an MSYS shell.
; The first build compiles ESP-IDF itself and takes a while.

[env:crowpanel_round_dash]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
framework = espidf
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
monitor_speed = 115200
custom_channels = crowpanel_round.channels.json
lib_deps =
  https://models.tracecraft.app/sdk/usb/TraceCraftCore-0.1.14.zip
  https://models.tracecraft.app/sdk/usb/TraceCraftDisplay-0.1.14.zip
