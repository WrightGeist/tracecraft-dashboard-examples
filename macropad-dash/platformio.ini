; MacroPad gamepad and dash. See README.md.

[env:macropad]
; See pico-shift-light for why this platform.
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#03bb48f
board = adafruit_macropad2040
framework = arduino
board_build.core = earlephilhower
custom_channels = macropad.channels.json
lib_ignore = USBHost
build_flags =
  -D USE_TINYUSB
  -D TRACECRAFT_BOARD_ID='"$PIOENV"'
lib_deps =
  adafruit/Adafruit SH110X
  https://models.tracecraft.app/sdk/usb/TraceCraftCore-0.1.13.zip
